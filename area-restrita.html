
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061426">
  <title>Área Restrita | RCI MedTech</title>
  <link rel="icon" type="image/png" href="assets/img/logo-emblema.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .access-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: linear-gradient(135deg, #061426, #0b2340);
    }
    .access-card {
      width: 100%;
      max-width: 460px;
      padding: 40px;
      text-align: center;
      background: #0b2340;
      border: 1px solid rgba(57, 213, 255, .25);
      border-radius: 18px;
      color: #fff;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .access-card img {
      width: 90px;
      margin-bottom: 18px;
    }
    .access-card h1 {
      color: #39d5ff;
      margin-bottom: 10px;
    }
    .access-card p {
      color: #c5d5e5;
      line-height: 1.6;
    }
    .access-card a {
      display: inline-block;
      margin-top: 20px;
      color: #39d5ff;
    }
  </style>
</head>
<body>
  <main class="access-page">
    <section class="access-card">
      <img src="assets/img/logo-emblema.png" alt="RCI MedTech">
      <h1>Área Restrita</h1>
      <p>Ambiente de acesso exclusivo da plataforma RCI MedTech.</p>
      <p>Estamos preparando o sistema de autenticação e acesso aos conteúdos.</p>
      <a href="index.html">Voltar ao portal principal</a>
    </section>
  </main>
</body>
</html>
